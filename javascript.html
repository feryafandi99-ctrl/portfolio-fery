<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script>

function jumlahkan() {

    // Mengambil nilai angka pertama
    const angka1 = parseFloat(
        document.getElementById("angka1").value
    );


    // Mengambil nilai angka kedua
    const angka2 = parseFloat(
        document.getElementById("angka2").value
    );


    // Mengecek apakah input kosong
    if (isNaN(angka1) || isNaN(angka2)) {

        alert(
            "Silakan masukkan kedua angka terlebih dahulu."
        );

        return;

    }


    // Melakukan operasi penjumlahan
    const hasil = angka1 + angka2;


    // Menampilkan hasil
    document.getElementById("hasil").textContent = hasil;


    // Menampilkan kotak hasil
    document.getElementById("hasilBox")
            .classList.remove("hidden");

}

</script>
